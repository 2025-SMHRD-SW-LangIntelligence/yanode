# 로컬 테스트
services:
  backend:
      build:
        context: ./backend
        dockerfile: Dockerfile
      image: myapp-backend:test
      container_name: myapp-backend
      # 외부 공개가 꼭 필요하지 않으면 ports를 제거하세요 (Nginx 프록시만 사용 시)
      # 필요할 때만 호스트 포트 바인딩:
      ports:
        - "8090:8090"    # 로컬에서 직접 테스트용
      environment:
        # --- Java/Spring 공통 ---
        - JAVA_OPTS=-Xms256m -Xmx512m -Dserver.port=8090

        # --- 외부 DB 접속 정보(.env에서 주입) ---
        - SPRING_DATASOURCE_URL=${SPRING_DATASOURCE_URL}
        - SPRING_DATASOURCE_USERNAME=${SPRING_DATASOURCE_USERNAME}
        - SPRING_DATASOURCE_PASSWORD=${SPRING_DATASOURCE_PASSWORD}
        # 드라이버(대부분 자동감지되지만 명시해도 무방)
        - SPRING_DATASOURCE_DRIVER_CLASS_NAME=${SPRING_DATASOURCE_DRIVER_CLASS_NAME}

        # JPA 편의(개발용): 운영에서는 마이그레이션 툴 권장
        - SPRING_JPA_HIBERNATE_DDL_AUTO=update
        - SPRING_JPA_PROPERTIES_HIBERNATE_FORMAT_SQL=true
      restart: unless-stopped
      networks: [app-net]


  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
          - VITE_API_BASE_URL=/api   
    image: myapp-frontend:test  
    container_name: myapp-frontend
    ports:
      - "80:80"                   
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - app-net

networks:
  app-net:
    driver: bridge
